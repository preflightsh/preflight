version: 2

project_name: preflight

builds:
  - id: preflight
    main: ./main.go
    binary: preflight
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/preflightsh/preflight/cmd.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

brews:
  - name: preflight
    # auto skips prereleases, so an rc tag never reaches brew upgrade.
    # Snapshots never reach the publish step at all.
    skip_upload: auto
    repository:
      owner: preflightsh
      name: homebrew-preflight
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    description: "Preflight CLI for launch readiness checks"
    homepage: "https://github.com/preflightsh/preflight"
    commit_author:
      name: "GitHub Actions"
      email: "actions@github.com"
    install: |
      bin.install "preflight"
    test: |
      assert_match version.to_s, shell_output("#{bin}/preflight version")

dockers:
  - id: preflight-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/preflightsh/preflight:{{ .Version }}-amd64"
      - "{{ if not .Prerelease }}ghcr.io/preflightsh/preflight:latest-amd64{{ end }}"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"

  - id: preflight-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/preflightsh/preflight:{{ .Version }}-arm64"
      - "{{ if not .Prerelease }}ghcr.io/preflightsh/preflight:latest-arm64{{ end }}"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/preflightsh/preflight:{{ .Version }}"
    image_templates:
      - "ghcr.io/preflightsh/preflight:{{ .Version }}-amd64"
      - "ghcr.io/preflightsh/preflight:{{ .Version }}-arm64"

  # The moving tags below are for stable releases only. An empty name
  # skips the manifest, so a prerelease publishes just its own version
  # tag and never moves latest, the major, or the minor. They point at
  # the version images because latest-<arch> is not pushed for a
  # prerelease either.
  - name_template: "{{ if not .Prerelease }}ghcr.io/preflightsh/preflight:latest{{ end }}"
    image_templates:
      - "ghcr.io/preflightsh/preflight:{{ .Version }}-amd64"
      - "ghcr.io/preflightsh/preflight:{{ .Version }}-arm64"

  - name_template: "{{ if not .Prerelease }}ghcr.io/preflightsh/preflight:{{ .Major }}{{ end }}"
    image_templates:
      - "ghcr.io/preflightsh/preflight:{{ .Version }}-amd64"
      - "ghcr.io/preflightsh/preflight:{{ .Version }}-arm64"

  - name_template: "{{ if not .Prerelease }}ghcr.io/preflightsh/preflight:{{ .Major }}.{{ .Minor }}{{ end }}"
    image_templates:
      - "ghcr.io/preflightsh/preflight:{{ .Version }}-amd64"
      - "ghcr.io/preflightsh/preflight:{{ .Version }}-arm64"

release:
  # A tag with a semver prerelease part (v1.0.0-rc.1) is marked as a
  # prerelease, so GitHub's latest release, which the update notifier
  # and install.sh both read, stays on the last stable version.
  prerelease: auto

changelog:
  disable: true
