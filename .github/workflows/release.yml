name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Gate the privileged release path behind a GitHub Environment so
    # tag-creation alone isn't enough to publish — the environment can
    # require reviewer approval and/or restrict to protected tag refs.
    # Configure the "release" environment in repo Settings → Environments.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        # setup-go v6+ exports GOTOOLCHAIN=local, so the version resolved
        # here is the one that builds the release: no go.mod toolchain
        # directive can quietly swap in a different compiler. It also
        # means go-version must stay >= the go directive in go.mod, or
        # every go command fails instead of downloading a toolchain.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          # Without this, setup-go takes any cached 1.25.x the runner
          # image happens to ship and never looks for a newer patch, so
          # the toolchain that builds a release is whatever the runner
          # was baked with. That silently decides whether standard
          # library CVEs land in published binaries.
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Trigger npm publish
        env:
          DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/preflightsh/npm-preflight/dispatches \
            -d "{\"event_type\":\"publish\",\"client_payload\":{\"version\":\"$VERSION\"}}"

      - name: Trigger AutoChangelog
        env:
          WEBHOOK_SECRET: ${{ secrets.AUTOCHANGELOG_WEBHOOK_SECRET }}
        run: |
          BODY='{"bump": "patch"}'
          SIGNATURE=$(printf '%s' "$BODY" | python3 -c "import hmac, hashlib, os, sys; print(hmac.new(os.environ['WEBHOOK_SECRET'].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())")
          curl -fsSL -X POST https://autochangelog.com/api/v1/hooks/045aaccf-bd97-4227-bf8f-bec556e4331b \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: sha256=$SIGNATURE" \
            -d "$BODY"
