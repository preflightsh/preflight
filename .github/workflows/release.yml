name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}

  release:
    needs: validate
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    # Gate the privileged release path behind a GitHub Environment so
    # tag-creation alone isn't enough to publish: the environment can
    # require reviewer approval and/or restrict to protected tag refs.
    # Configure the "release" environment in repo Settings → Environments.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GoReleaser authenticates with its own tokens; don't leave the
          # job token in .git/config for every later step to read.
          persist-credentials: false

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Go
        # setup-go v6+ exports GOTOOLCHAIN=local, so the version resolved
        # here is the one that builds the release: no go.mod toolchain
        # directive can quietly swap in a different compiler. It also
        # means go-version must stay >= the go directive in go.mod, or
        # every go command fails instead of downloading a toolchain.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # Without this, setup-go takes any cached 1.26.x the runner
          # image happens to ship and never looks for a newer patch, so
          # the toolchain that builds a release is whatever the runner
          # was baked with. That silently decides whether standard
          # library CVEs land in published binaries.
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest build provenance
        # Signs a SLSA provenance statement for every archive listed in
        # checksums.txt, so users can check a download came from this
        # workflow: gh attestation verify <file> --repo preflightsh/preflight
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Trigger npm publish
        env:
          DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # npm-preflight publishes a prerelease version (anything with a
          # "-") under the next dist-tag, so an rc never moves latest.
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/preflightsh/npm-preflight/dispatches \
            -d "{\"event_type\":\"publish\",\"client_payload\":{\"version\":\"$VERSION\"}}"

      - name: Trigger AutoChangelog
        env:
          WEBHOOK_SECRET: ${{ secrets.AUTOCHANGELOG_WEBHOOK_SECRET }}
        run: |
          # Send the tag as the version. AutoChangelog keeps its own counter
          # when only a bump type is given, and it had drifted to v0.13.0
          # while the CLI was at v0.21.0; naming the version pins the two.
          BODY="{\"version\": \"$GITHUB_REF_NAME\", \"title\": \"Release $GITHUB_REF_NAME\"}"
          echo "AutoChangelog: $BODY"
          SIGNATURE=$(printf '%s' "$BODY" | python3 -c "import hmac, hashlib, os, sys; print(hmac.new(os.environ['WEBHOOK_SECRET'].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())")
          curl -fsSL -X POST https://autochangelog.com/api/v1/hooks/045aaccf-bd97-4227-bf8f-bec556e4331b \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: sha256=$SIGNATURE" \
            -d "$BODY"
