name: Vulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Advisories get published against code that hasn't changed, so a
    # scan that only runs on push will never see them. The x/image webp
    # panics sat in a pinned dependency with no commit to trigger on.
    # Offset from the hour: scheduled jobs at :00 queue behind everyone
    # else's.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        # Keep this spec and check-latest in step with release.yml.
        # Standard library findings are relative to the toolchain doing
        # the scanning, so if this drifts from the toolchain that builds
        # releases, the scan stops describing the published binaries.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      # Reports only vulnerabilities this code can actually reach, which
      # is the part Dependabot's version matching misses in both
      # directions: it flagged a TIFF CVE nothing here imports, while the
      # reachable webp panics in the same module went unreported.
      - name: govulncheck
        run: govulncheck ./...
